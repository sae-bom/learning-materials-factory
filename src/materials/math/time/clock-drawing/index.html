<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시계 그리기 학습지</title>
    <link rel="stylesheet" href="../../../../shared/styles/fonts.css" />
    <link rel="stylesheet" href="../../../../shared/styles/colors.css" />
    <link rel="stylesheet" href="../../../../shared/styles/toolbar.css" />
    <link rel="stylesheet" href="../../../../shared/styles/print.css" />
    <script defer src="../../../../shared/utils/png-export.js"></script>
    <style>
      :root {
        --print-page-margin-block: 14mm;
        --print-page-margin-inline: 16mm;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--screen);
        font-family: var(--font-sans);
      }

      .toolbar-option {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
      }

      .toolbar-option input {
        min-height: auto;
        padding: 0;
      }

      .sheet {
        position: relative;
        display: flex;
        flex-direction: column;
        width: var(--print-page-width);
        height: var(--print-page-height);
        margin: 0 auto 24px;
        padding: var(--print-page-margin-block) var(--print-page-margin-inline);
        background: var(--paper);
        box-shadow: 0 6px 24px rgb(0 0 0 / 10%);
        break-after: page;
      }

      h1 {
        margin: 0;
        font-size: 9mm;
        line-height: 1;
        letter-spacing: -0.5mm;
      }

      .header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        padding-bottom: 4mm;
        border-bottom: 0.7mm solid var(--ink);
      }

      .sub {
        color: var(--gray);
        font-size: 3.7mm;
        font-weight: 700;
      }

      .instruction {
        margin: 4mm 0 5mm;
        color: var(--gray);
        font-size: 4mm;
      }

      .questions {
        display: grid;
        flex: 1;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 5mm 8mm;
        min-height: 0;
      }

      .question {
        display: grid;
        grid-template-columns: 1fr 35mm;
        align-items: center;
        min-height: 0;
        border: 0.45mm solid var(--line);
        border-radius: 3mm;
      }

      .clock-wrap {
        display: grid;
        place-items: center;
        min-width: 0;
        padding: 3mm;
      }

      .clock {
        width: 50mm;
        max-width: 100%;
        height: 50mm;
      }

      .clock .hour,
      .clock .minute {
        display: none;
      }

      .show-hour-hand .clock .hour,
      .show-minute-hand .clock .minute {
        display: block;
      }

      .color-mode .clock .hour {
        stroke: #2563a6;
      }

      .color-mode .clock .minute {
        stroke: #d94b45;
      }

      .answer {
        display: flex;
        flex-direction: column;
        align-self: stretch;
        justify-content: center;
        gap: 5mm;
        padding: 3mm;
        border-left: 0.35mm dashed #c2c2c2;
        font-size: 5mm;
        font-weight: 700;
        text-align: center;
      }

      @media (max-width: 210mm) {
        .sheet {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav class="toolbar-shell" data-print-hidden aria-label="학습지 설정">
      <div class="toolbar-card">
        <label
          >난이도
          <select id="difficulty">
            <option value="hour">0분만</option>
            <option value="half">0분과 30분</option>
            <option value="five" selected>5분 단위</option>
            <option value="any">제한 없음</option>
          </select>
        </label>
        <label class="toolbar-option">
          <input id="minuteHints" type="checkbox" />
          분 읽기 숫자 표시
        </label>
        <label class="toolbar-option">
          <input id="colorMode" type="checkbox" checked />
          컬러 모드
        </label>
        <label class="toolbar-option">
          <input id="showHourHand" type="checkbox" />
          시침 표시
        </label>
        <label class="toolbar-option">
          <input id="showMinuteHand" type="checkbox" />
          분침 표시
        </label>
        <button class="primary" id="newSheet" type="button">
          새 학습지 만들기
        </button>
        <button type="button" data-png-export>PNG 저장</button>
        <button id="print" type="button" data-print>인쇄 / PDF 저장</button>
      </div>
    </nav>
    <main id="worksheets"></main>
    <script>
      const TAU = Math.PI * 2;
      const difficulty = document.querySelector("#difficulty");
      const minuteHints = document.querySelector("#minuteHints");
      const colorMode = document.querySelector("#colorMode");
      const showHourHand = document.querySelector("#showHourHand");
      const showMinuteHand = document.querySelector("#showMinuteHand");

      function randomInt(max) {
        return Math.floor(Math.random() * max);
      }

      function makeTime(mode) {
        const minute =
          mode === "hour"
            ? 0
            : mode === "half"
              ? randomInt(2) * 30
              : mode === "five"
                ? randomInt(12) * 5
                : randomInt(60);
        return { hour: randomInt(12) || 12, minute };
      }

      function polar(cx, cy, radius, angle) {
        return `${cx + Math.sin(angle) * radius},${cy - Math.cos(angle) * radius}`;
      }

      function clockSvg({ hour, minute }, showMinuteTicks) {
        const hourAngle = ((hour % 12 + minute / 60) * TAU) / 12;
        const minuteAngle = (minute * TAU) / 60;
        const ticks = showMinuteTicks
          ? Array.from({ length: 60 }, (_, i) => {
              const angle = (i * TAU) / 60;
              const innerRadius = i % 5 === 0 ? 36 : 39;
              const [x1, y1] = polar(50, 50, innerRadius, angle).split(",");
              const [x2, y2] = polar(50, 50, 42, angle).split(",");
              return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
            }).join("")
          : "";
        const numbers = Array.from({ length: 12 }, (_, i) => {
          const number = i + 1;
          const angle = (number * TAU) / 12;
          const [numberX, numberY] = polar(50, 50, 32, angle).split(",");
          const [hintX, hintY] = polar(50, 50, 47, angle).split(",");
          return `<text x="${numberX}" y="${numberY}" text-anchor="middle" dominant-baseline="middle">${number}</text><text class="hint" x="${hintX}" y="${hintY}" text-anchor="middle" dominant-baseline="middle">${(number * 5) % 60}</text>`;
        }).join("");
        const [hourX, hourY] = polar(50, 50, 23, hourAngle).split(",");
        const [minuteX, minuteY] = polar(50, 50, 34, minuteAngle).split(",");

        return `<svg class="clock" viewBox="0 0 100 100" role="img" aria-label="바늘을 그리는 시계"><style>line{stroke:var(--gray-dark);stroke-width:1}text{font-family:var(--font-sans);font-size:8px;font-weight:700;fill:var(--ink)}.hint{display:none;font-size:4.5px;fill:var(--gray);font-weight:400}.show-hints .hint{display:block}.face{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}.hand{stroke:var(--ink);stroke-linecap:round}.hour{stroke-width:3}.minute{stroke-width:1.8}</style><circle class="face" cx="50" cy="50" r="43"/>${ticks}${numbers}<line class="hand hour" x1="50" y1="50" x2="${hourX}" y2="${hourY}"/><line class="hand minute" x1="50" y1="50" x2="${minuteX}" y2="${minuteY}"/><circle cx="50" cy="50" r="2.2" fill="var(--ink)"/></svg>`;
      }

      function render() {
        const mode = difficulty.value;
        const cards = Array.from({ length: 8 }, () => {
          const time = makeTime(mode);
          return `<article class="question"><div class="clock-wrap">${clockSvg(time, mode === "any")}</div><div class="answer"><span>${time.hour}시 ${time.minute}분</span></div></article>`;
        }).join("");
        document.querySelector("#worksheets").innerHTML =
          `<section class="sheet${minuteHints.checked ? " show-hints" : ""}${colorMode.checked ? " color-mode" : ""}${showHourHand.checked ? " show-hour-hand" : ""}${showMinuteHand.checked ? " show-minute-hand" : ""}" data-print-page data-png-filename="시계그리기_학습지"><header class="header"><h1>시계 그리기</h1><span class="sub">시각을 보고 시계에 바늘을 그려 보세요</span></header><p class="instruction">주어진 시각을 읽고 빈 시계에 시침과 분침을 그려 보세요.</p><div class="questions">${cards}</div></section>`;
      }

      function toggleClass(control, className) {
        document
          .querySelector(".sheet")
          ?.classList.toggle(className, control.checked);
      }

      difficulty.addEventListener("change", render);
      minuteHints.addEventListener("change", () =>
        toggleClass(minuteHints, "show-hints"),
      );
      colorMode.addEventListener("change", () =>
        toggleClass(colorMode, "color-mode"),
      );
      showHourHand.addEventListener("change", () =>
        toggleClass(showHourHand, "show-hour-hand"),
      );
      showMinuteHand.addEventListener("change", () =>
        toggleClass(showMinuteHand, "show-minute-hand"),
      );
      document.querySelector("#newSheet").addEventListener("click", render);
      document
        .querySelector("#print")
        .addEventListener("click", () => window.print());
      render();
    </script>
  </body>
</html>
