<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>그림을 모아 더해요</title>
    <link rel="stylesheet" href="../../../../shared/styles/fonts.css" />
    <link rel="stylesheet" href="../../../../shared/styles/colors.css" />
    <link rel="stylesheet" href="../../../../shared/styles/toolbar.css" />
    <link rel="stylesheet" href="../../../../shared/styles/print.css" />
    <script defer src="../../../../shared/utils/print.js"></script>
    <script defer src="../../../../shared/utils/png-export.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--screen);
        font-family: var(--font-sans);
      }

      .sheet {
        margin: 18px auto 24px;
        background: var(--paper);
        box-shadow: 0 6px 24px rgb(0 0 0 / 10%);
      }

      .header-row {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 8mm;
        padding-bottom: 3.5mm;
        border-bottom: 0.7mm solid var(--ink);
      }

      h1 {
        margin: 0;
        font-size: 9mm;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.6mm;
      }

      .level-label {
        color: var(--gray);
        font-size: 3.6mm;
        font-weight: 700;
        white-space: nowrap;
      }

      .instruction {
        margin: 3.5mm 0 5mm;
        color: var(--gray-dark);
        font-size: 4mm;
        line-height: 1.5;
      }

      .problems {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 5mm 7mm;
        height: 209mm;
      }

      .problem {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 3.5mm;
        border: 0.45mm solid var(--line);
        border-radius: 3mm;
        background: #fff;
        break-inside: avoid;
      }

      .problem-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 5mm;
        margin-bottom: 2mm;
        color: var(--gray-dark);
        font-size: 3.2mm;
        font-weight: 700;
      }

      .example-label {
        color: var(--ink);
      }

      .whole {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: stretch;
        flex: 1;
        min-height: 0;
        border: 0.5mm solid var(--ink);
        border-radius: 2mm;
      }

      .group {
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        min-height: 28mm;
        padding: 2mm;
        gap: 1mm;
      }

      .group + .group {
        border-left: 0.3mm solid var(--line);
      }

      .item {
        width: 8mm;
        text-align: center;
        font-size: 7.5mm;
        line-height: 1;
      }

      .whole-label {
        margin: 1mm 0 1.5mm;
        text-align: center;
        color: var(--gray-dark);
        font-size: 3.1mm;
      }

      .equation {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2mm;
        min-height: 13mm;
      }

      .number-box {
        display: grid;
        place-items: center;
        width: 11mm;
        height: 11mm;
        border: 0.55mm solid var(--gray-dark);
        font-size: 6.5mm;
        font-weight: 700;
      }

      .operator {
        min-width: 5mm;
        text-align: center;
        font-size: 6mm;
        font-weight: 700;
      }

      @media (max-width: 820px) {
        .sheet {
          transform-origin: top left;
        }
      }
    </style>
  </head>
  <body>
    <nav class="toolbar-shell" aria-label="학습지 설정" data-print-hidden>
      <div class="toolbar-card">
        <label>
          합의 범위
          <select id="level">
            <option value="small" selected>5 이하</option>
            <option value="large">6~9</option>
            <option value="mixed">전체 섞기 (9 이하)</option>
          </select>
        </label>
        <label>
          표시 방식
          <select id="displayMode">
            <option value="example" selected>첫 문제만 예시</option>
            <option value="practice">모두 빈칸</option>
            <option value="answer">정답지</option>
          </select>
        </label>
        <button class="primary" type="button" id="newSheetButton">
          새 학습지 만들기
        </button>
        <button type="button" data-png-export>PNG 저장</button>
        <button type="button" data-print>인쇄 / PDF 저장</button>
      </div>
    </nav>

    <main
      class="sheet"
      data-print-page
      data-png-filename="그림을_모아_더해요"
    >
      <header class="header-row">
        <h1>그림을 모아 더해요</h1>
        <span class="level-label" id="levelLabel"></span>
      </header>
      <p class="instruction">
        왼쪽과 오른쪽 그림을 세어 보세요. 두 무리를 모으면 모두 몇 개인지
        덧셈식에 써 보세요.
      </p>
      <section class="problems" id="problems" aria-label="그림 덧셈 문제"></section>
    </main>

    <script>
      const symbolPool = [
        "🧸",
        "🍪",
        "⭐",
        "🍬",
        "🌲",
        "🐟",
        "🌼",
        "🍓",
        "🍄",
        "🐞",
        "🐠",
        "🌟",
        "🍎",
        "🚗",
        "🌈",
        "🎈",
      ];

      const levelInput = document.querySelector("#level");
      const modeInput = document.querySelector("#displayMode");
      const problemArea = document.querySelector("#problems");
      const levelLabel = document.querySelector("#levelLabel");
      let problems = [];

      function shuffle(values) {
        const result = [...values];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[randomIndex]] = [
            result[randomIndex],
            result[index],
          ];
        }
        return result;
      }

      function makePool(minSum, maxSum) {
        const pool = [];
        for (let first = 1; first <= 8; first += 1) {
          for (let second = first; second <= 8; second += 1) {
            const sum = first + second;
            if (sum >= minSum && sum <= maxSum) {
              pool.push({ first, second });
            }
          }
        }
        return shuffle(pool);
      }

      function generateProblems() {
        const level = levelInput.value;
        const small = makePool(2, 5);
        const large = makePool(6, 9);
        const selected =
          level === "small"
            ? small
            : level === "large"
              ? large.slice(0, 6)
              : shuffle([...small.slice(0, 3), ...large.slice(0, 3)]);
        const symbols = shuffle(symbolPool);
        problems = selected.map(({ first, second }, index) => {
          const reverse = Math.random() < 0.5;
          return {
            first: reverse ? second : first,
            second: reverse ? first : second,
            symbol: symbols[index],
          };
        });
        render();
      }

      function createGroup(symbol, count) {
        const group = document.createElement("div");
        group.className = "group";
        for (let index = 0; index < count; index += 1) {
          const item = document.createElement("span");
          item.className = "item";
          item.textContent = symbol;
          item.setAttribute("aria-hidden", "true");
          group.append(item);
        }
        return group;
      }

      function createNumberBox(number, showAnswer) {
        const box = document.createElement("span");
        box.className = "number-box number-text";
        box.textContent = showAnswer ? number : "";
        return box;
      }

      function createProblem(problem, index) {
        const showAnswer =
          modeInput.value === "answer" ||
          (modeInput.value === "example" && index === 0);
        const card = document.createElement("article");
        card.className = "problem";
        card.setAttribute(
          "aria-label",
          `${problem.first}개와 ${problem.second}개를 모으는 문제`,
        );

        const heading = document.createElement("div");
        heading.className = "problem-heading";
        const indexLabel = document.createElement("span");
        indexLabel.textContent = `${index + 1}.`;
        const exampleLabel = document.createElement("span");
        exampleLabel.className = "example-label";
        exampleLabel.textContent =
          modeInput.value === "example" && index === 0 ? "보기" : "";
        heading.append(indexLabel, exampleLabel);

        const whole = document.createElement("div");
        whole.className = "whole";
        whole.append(
          createGroup(problem.symbol, problem.first),
          createGroup(problem.symbol, problem.second),
        );

        const wholeLabel = document.createElement("div");
        wholeLabel.className = "whole-label";
        wholeLabel.textContent = "모으면 모두 몇 개?";

        const equation = document.createElement("div");
        equation.className = "equation";
        const add = document.createElement("span");
        add.className = "operator number-text";
        add.textContent = "+";
        const equals = document.createElement("span");
        equals.className = "operator number-text";
        equals.textContent = "=";
        equation.append(
          createNumberBox(problem.first, showAnswer),
          add,
          createNumberBox(problem.second, showAnswer),
          equals,
          createNumberBox(problem.first + problem.second, showAnswer),
        );

        card.append(heading, whole, wholeLabel, equation);
        return card;
      }

      function render() {
        const labels = {
          small: "합이 5 이하",
          large: "합이 6~9",
          mixed: "합이 9 이하",
        };
        levelLabel.textContent = labels[levelInput.value];
        problemArea.replaceChildren(...problems.map(createProblem));
      }

      document
        .querySelector("#newSheetButton")
        .addEventListener("click", generateProblems);
      levelInput.addEventListener("change", generateProblems);
      modeInput.addEventListener("change", render);
      generateProblems();
    </script>
  </body>
</html>
