<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10을 만들어 더해요</title>
  <style>
    :root {
      --ink: #1d1d1b;
      --line: #686868;
      --soft: #f2f2f2;
      --accent: #555;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #dedede;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: end;
      padding: 12px 18px;
      background: #fff;
      border-bottom: 1px solid #bbb;
      box-shadow: 0 2px 8px #0002;
      font-size: 14px;
    }

    .toolbar label { display: grid; gap: 4px; }
    .toolbar input, .toolbar select, .toolbar button {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #999;
      border-radius: 5px;
      background: #fff;
      font: inherit;
    }
    .toolbar input[type="text"] { width: 270px; }
    .toolbar button { cursor: pointer; font-weight: 700; }
    .toolbar button.primary { color: #fff; background: #333; border-color: #333; }

    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 18px auto;
      padding: 13mm 14mm 12mm;
      background: #fff;
      box-shadow: 0 3px 18px #0003;
    }

    header { position: relative; text-align: center; }
    h1 {
      display: inline-block;
      margin: 0;
      padding: 0 10px 5px;
      border-bottom: 2px solid var(--ink);
      font-size: 25px;
      letter-spacing: -.03em;
    }
    .guide {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5mm 0 4mm;
      padding: 8px 12px;
      border: 1px solid #aaa;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.45;
    }
    .guide strong {
      flex: none;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 12px;
    }

    #problems { display: grid; gap: 4.5mm; }
    .problem {
      display: grid;
      grid-template-columns: 10mm 19mm 6mm 19mm 7mm 47mm 7mm 19mm 7mm 23mm;
      grid-template-rows: 17mm 5mm;
      align-items: center;
      justify-content: center;
      column-gap: 1.8mm;
      break-inside: avoid;
    }
    .number, .work, .remainder, .answer {
      height: 17mm;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--line);
      background: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
    }
    .index { font-size: 13px; color: #555; }
    .sign { text-align: center; font-family: Georgia, serif; font-size: 23px; }
    .work { gap: 7mm; border-width: 1.8px; }
    .work .fill { min-width: 9mm; text-align: center; }
    .answer { border-width: 2px; }
    .hint {
      align-self: start;
      text-align: center;
      color: #555;
      font-size: 11px;
      white-space: nowrap;
    }
    .make-ten { grid-column: 6; }
    .left-over { grid-column: 8; }
    .final-hint { grid-column: 10; }
    .filled { font-weight: 700; }

    .footer {
      margin-top: 5mm;
      border-top: 1px solid #aaa;
      padding-top: 3mm;
      text-align: center;
      color: #666;
      font-size: 11px;
    }

    .sheet.compact #problems { gap: 2.5mm; }
    .sheet.compact .problem { grid-template-rows: 15mm 4mm; }
    .sheet.compact .number,
    .sheet.compact .work,
    .sheet.compact .remainder,
    .sheet.compact .answer { height: 15mm; }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .sheet { margin: 0; box-shadow: none; }
    }

    @media (max-width: 820px) {
      .sheet { transform-origin: top left; }
      .toolbar input[type="text"] { width: 210px; }
    }
  </style>
</head>
<body>
  <section class="toolbar" aria-label="학습지 설정">
    <label>문제 수
      <select id="problemCount">
        <option>6</option><option selected>8</option><option>9</option>
      </select>
    </label>
    <label>문제 직접 입력 (예: 8+5, 9+7)
      <input id="customProblems" type="text" placeholder="비우면 자동 생성">
    </label>
    <label>표시 방식
      <select id="displayMode">
        <option value="practice">연습용 (모두 빈칸)</option>
        <option value="example">첫 문제만 예시</option>
        <option value="answer">정답지</option>
      </select>
    </label>
    <button id="generateButton" class="primary" type="button">새 학습지 만들기</button>
    <button id="printButton" type="button">인쇄 / PDF 저장</button>
  </section>

  <main class="sheet">
    <header>
      <h1>10을 만들어 더해요</h1>
    </header>

    <div class="guide">
      <strong>생각 순서</strong>
      앞 수에 몇을 더하면 10이 되는지 생각하고, 뒷 수를 가른 뒤, 10과 남은 수를 더해요.
    </div>

    <section id="problems" aria-label="받아올림 덧셈 문제"></section>
    <div class="footer">앞 수를 10으로 만들면 덧셈이 쉬워져요.</div>
  </main>

  <script>
    const problemArea = document.querySelector('#problems');
    const countInput = document.querySelector('#problemCount');
    const customInput = document.querySelector('#customProblems');
    const modeInput = document.querySelector('#displayMode');

    function shuffled(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function makeProblemPool() {
      const pool = [];
      for (let first = 1; first <= 9; first += 1) {
        for (let second = 1; second <= 9; second += 1) {
          if (first + second >= 10) pool.push([first, second]);
        }
      }
      return shuffled(pool);
    }

    function parseCustomProblems() {
      const seen = new Set();
      return customInput.value
        .split(/[\n,]+/)
        .map(text => text.trim().match(/^(\d)\s*\+\s*(\d)$/))
        .filter(Boolean)
        .map(match => [Number(match[1]), Number(match[2])])
        .filter(([a, b]) => a >= 1 && a <= 9 && b >= 1 && b <= 9 && a + b >= 10)
        .filter(([a, b]) => {
          const key = `${a},${b}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function problemMarkup(first, second, index, showAnswer) {
      const toTen = 10 - first;
      const remainder = second - toTen;
      const answer = first + second;
      const value = number => showAnswer ? `<span class="filled">${number}</span>` : '<span>&nbsp;</span>';

      return `
        <article class="problem">
          <div class="index">${index + 1}.</div>
          <div class="number">${first}</div>
          <div class="sign">+</div>
          <div class="number">${second}</div>
          <div class="sign">=</div>
          <div class="work"><span>${first}</span><span>+</span><span class="fill">${value(toTen)}</span></div>
          <div class="sign">+</div>
          <div class="remainder">${value(remainder)}</div>
          <div class="sign">=</div>
          <div class="answer">${value(answer)}</div>
          <div class="hint make-ten">① 10 만들기</div>
          <div class="hint left-over">② 남은 수</div>
          <div class="hint final-hint">③ 답</div>
        </article>`;
    }

    function render() {
      const requestedCount = Number(countInput.value);
      const custom = parseCustomProblems();
      const problems = custom.length ? custom.slice(0, 9) : makeProblemPool().slice(0, requestedCount);
      const mode = modeInput.value;
      document.querySelector('.sheet').classList.toggle('compact', problems.length === 9);
      problemArea.innerHTML = problems.map(([first, second], index) => {
        const showAnswer = mode === 'answer' || (mode === 'example' && index === 0);
        return problemMarkup(first, second, index, showAnswer);
      }).join('');
    }

    document.querySelector('#generateButton').addEventListener('click', render);
    document.querySelector('#printButton').addEventListener('click', () => window.print());
    modeInput.addEventListener('change', render);
    countInput.addEventListener('change', render);
    render();
  </script>
</body>
</html>
