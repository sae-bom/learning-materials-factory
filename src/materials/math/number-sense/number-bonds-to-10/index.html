<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 가르기 문제지</title>
  <link rel="stylesheet" href="../../../../shared/styles/print.css">
  <script defer src="../../../../shared/utils/print.js"></script>
  <style>
    :root {
      --ink: #171717;
      --paper: #fff;
      --screen: #eceff1;
      --box-size: 20mm;
      --line-width: 0.75mm;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--screen);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: rgb(236 239 241 / 92%);
      backdrop-filter: blur(6px);
    }

    button {
      border: 1px solid #aaa;
      border-radius: 999px;
      padding: 9px 17px;
      color: #222;
      background: #fff;
      font: 700 14px inherit;
      cursor: pointer;
    }

    button:first-child {
      color: #fff;
      border-color: #222;
      background: #222;
    }

    .sheet {
      margin: 0 auto 24px;
      background: var(--paper);
      box-shadow: 0 6px 24px rgb(0 0 0 / 10%);
    }

    .sheet-header {
      padding-bottom: 3mm;
      border-bottom: 0.7mm solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: 8mm;
      line-height: 1;
      letter-spacing: -0.5mm;
    }

    .instruction {
      margin: 3mm 0 4mm;
      color: #444;
      font-size: 4mm;
      font-weight: 700;
    }

    .problems {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4mm 6mm;
      height: 239mm;
    }

    .problem {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
    }

    .bond {
      position: relative;
      width: 49mm;
      height: 59mm;
    }

    .box {
      position: absolute;
      display: grid;
      place-items: center;
      width: var(--box-size);
      height: var(--box-size);
      border: var(--line-width) solid var(--ink);
      background: #fff;
      font-size: 9mm;
      font-weight: 500;
      line-height: 1;
    }

    .whole {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 700;
    }

    .part-left { bottom: 0; left: 0; }
    .part-right { right: 0; bottom: 0; }

    .branch {
      position: absolute;
      top: 19.5mm;
      left: 50%;
      width: 0.75mm;
      height: 22mm;
      background: var(--ink);
      transform-origin: top center;
      z-index: 0;
    }

    .branch-left { transform: rotate(43deg); }
    .branch-right { transform: rotate(-43deg); }

    .part-left,
    .part-right { z-index: 1; }

    @media (max-width: 800px) {
      .sheet {
        transform-origin: top left;
      }
    }

  </style>
</head>
<body>
  <nav class="toolbar" aria-label="문제지 메뉴" data-print-hidden>
    <button type="button" data-print>인쇄하기</button>
    <button type="button" id="shuffleButton">문제 다시 섞기</button>
    <button type="button" id="exportButton">PNG 저장</button>
  </nav>

  <main class="sheet" data-print-page>
    <header class="sheet-header">
      <h1>10 가르기</h1>
    </header>

    <p class="instruction">10을 두 수로 가르고, 빈칸에 알맞은 수를 써 보세요.</p>
    <section class="problems" id="problems" aria-label="10 가르기 문제"></section>
  </main>

  <template id="problemTemplate">
    <article class="problem">
      <div class="bond">
        <span class="box whole">10</span>
        <span class="branch branch-left" aria-hidden="true"></span>
        <span class="branch branch-right" aria-hidden="true"></span>
        <span class="box part-left"></span>
        <span class="box part-right"></span>
      </div>
    </article>
  </template>

  <script src="html2canvas.min.js"></script>
  <script>
    const problemValues = [1, 2, 3, 4, 5, 6, 7, 8, 9];

    function shuffle(values) {
      const result = [...values];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function renderProblems() {
      const container = document.querySelector("#problems");
      const template = document.querySelector("#problemTemplate");
      const fragment = document.createDocumentFragment();

      shuffle(problemValues).forEach((value, index) => {
        const problem = template.content.firstElementChild.cloneNode(true);
        const showOnLeft = Math.random() < 0.5;
        const filledBox = problem.querySelector(showOnLeft ? ".part-left" : ".part-right");

        filledBox.textContent = value;
        problem.setAttribute("aria-label", `10을 가르는 ${index + 1}번 문제, 주어진 수 ${value}`);
        fragment.append(problem);
      });

      container.replaceChildren(fragment);
    }

    async function exportAsPng() {
      const button = document.querySelector("#exportButton");
      const sheet = document.querySelector(".sheet");
      const originalText = button.textContent;

      button.disabled = true;
      button.textContent = "저장 중…";

      try {
        if (typeof html2canvas !== "function") {
          throw new Error("html2canvas를 불러오지 못했습니다.");
        }

        const canvas = await html2canvas(sheet, {
          scale: 2,
          backgroundColor: "#fff",
          logging: false,
          useCORS: true,
          onclone: (clonedDocument) => {
            const clonedSheet = clonedDocument.querySelector(".sheet");
            clonedSheet.style.margin = "0";
            clonedSheet.style.boxShadow = "none";
          }
        });

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(
            (result) => result ? resolve(result) : reject(new Error("PNG 변환에 실패했습니다.")),
            "image/png"
          );
        });
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = "10_가르기_문제지.png";
        link.href = downloadUrl;
        link.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      } catch (error) {
        console.error(error);
        alert("PNG 저장에 실패했습니다. Chrome 또는 Edge에서 다시 시도해 주세요.");
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    document.querySelector("#shuffleButton").addEventListener("click", renderProblems);
    document.querySelector("#exportButton").addEventListener("click", exportAsPng);
    renderProblems();
  </script>
</body>
</html>
