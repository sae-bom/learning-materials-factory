<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자 세기 학습지</title>
  <link rel="stylesheet" href="../../../../shared/styles/print.css">
  <script defer src="../../../../shared/utils/print.js"></script>
  <style>
    :root { --ink: #202020; --muted: #666; --line: #aaa; --paper: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #eceff1; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    .toolbar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: center; gap: 8px; padding: 12px; background: rgb(236 239 241 / 92%); backdrop-filter: blur(6px); }
    .toolbar button { border: 1px solid #bbb; border-radius: 999px; padding: 9px 16px; color: #333; background: #fff; font: 700 14px inherit; cursor: pointer; }
    .toolbar button:first-child { color: #fff; border-color: #333; background: #333; }
    .sheet { position: relative; margin: 0 auto 24px; background: var(--paper); box-shadow: 0 6px 24px rgb(0 0 0 / 10%); break-after: page; }
    .sheet:last-child { break-after: auto; }
    .header-row { display: flex; align-items: end; justify-content: space-between; padding: 0 1mm 3.5mm; border-bottom: 0.7mm solid var(--ink); }
    h1 { margin: 0; font-size: 9.5mm; font-weight: 800; line-height: 1; letter-spacing: -0.7mm; }
    .page-label { color: var(--muted); font-size: 3.7mm; font-weight: 700; letter-spacing: 0.2mm; }
    .export-page { position: absolute; top: 5mm; right: 12mm; transform: translateY(-100%); border: 1px solid #bbb; border-radius: 999px; padding: 6px 12px; color: #444; background: #fff; font: 700 12px inherit; cursor: pointer; }
    .instruction { margin: 3.5mm 1mm 4.5mm; color: var(--muted); font-size: 4mm; line-height: 1.5; }
    .instruction::before { content: ""; display: inline-block; width: 2.2mm; height: 2.2mm; margin-right: 2.2mm; border: 0.4mm solid #888; border-radius: 50%; vertical-align: 0.1mm; }
    .questions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, 1fr); gap: 5mm 10mm; height: 235mm; }
    .question { display: grid; align-items: center; min-height: 0; border: 0.45mm solid var(--line); border-radius: 3.5mm; background: #fff; }
    .question.write { grid-template-columns: minmax(0, 1fr) 21mm; }
    .question.choose { grid-template-rows: minmax(0, 1fr) 14mm; }
    .items { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); place-content: center; place-items: center; align-self: stretch; gap: 0.8mm 1.2mm; min-width: 0; min-height: 0; padding: 3.5mm 4mm; }
    .item { display: grid; place-items: center; font-size: var(--item-size); line-height: 1; }
    .answer-area { display: grid; place-items: center; align-self: stretch; border-left: 0.35mm dashed #c2c2c2; }
    .answer-box { width: 14mm; height: 14mm; border: 0.55mm solid #727272; background: #fff; box-shadow: inset 0 0 0 0.45mm #c1c1c1; }
    .choices { display: grid; grid-template-columns: repeat(5, 1fr); place-items: center; gap: 1.5mm; padding: 1.5mm 8mm; border-top: 0.35mm dashed #c2c2c2; }
    .choice { display: grid; place-items: center; color: #222; font-size: 6mm; font-weight: 700; line-height: 1; }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="인쇄 메뉴" data-print-hidden>
    <button type="button" data-print>전체 4페이지 인쇄</button>
  </nav>
  <main id="worksheets"></main>
  <script src="html2canvas.min.js"></script>
  <script>
    // 그림 목록을 수정하면 자동 생성 문제에 반영됩니다.
    const symbolPool = [
      "🧸", "🍪", "⭐", "🍬", "🌲", "🐟", "🌼", "🍓",
      "🍄", "🐞", "🐠", "🌟", "🍎", "🚗", "🌈", "🎈"
    ];

    function shuffle(values) {
      const result = [...values];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function getQuestionLayout(count) {
      if (count <= 2) return { columns: count, size: 13 };
      if (count <= 4) return { columns: count, size: 12 };
      if (count <= 6) return { columns: 3, size: 10 };
      if (count <= 8) return { columns: 4, size: 9 };
      return { columns: 5, size: 9 };
    }

    function generateRangeCounts(min, max) {
      const counts = Array.from({ length: max - min + 1 }, (_, index) => min + index);
      while (counts.length < 8) {
        counts.push(min + Math.floor(Math.random() * (max - min + 1)));
      }
      return shuffle(counts);
    }

    function generateQuestions() {
      const counts = [
        ...generateRangeCounts(1, 5),
        ...generateRangeCounts(6, 10)
      ];
      const symbols = shuffle(symbolPool);
      return counts.map((count, index) => ({
        symbol: symbols[index % symbols.length],
        count,
        ...getQuestionLayout(count)
      }));
    }

    // 새로고침할 때 한 번 생성되며 두 학습지가 같은 문항을 공유합니다.
    const worksheetData = {
      title: "숫자 세기",
      writeInstruction: "그림의 개수를 세어 보고, 그 수를 네모 안에 써 보세요.",
      chooseInstruction: "그림의 개수를 세어 보고, 알맞은 숫자에 동그라미 하세요.",
      questions: generateQuestions()
    };

    const pageRanges = [
      { label: "1–5", min: 1, max: 5 },
      { label: "6–10", min: 6, max: 10 }
    ];

    function createItems(question) {
      const items = document.createElement("div");
      items.className = "items";
      items.style.setProperty("--columns", question.columns ?? 5);
      items.style.setProperty("--item-size", `${question.size ?? 11}mm`);
      for (let i = 0; i < question.count; i += 1) {
        const item = document.createElement("span");
        item.className = "item";
        item.textContent = question.symbol;
        item.setAttribute("aria-hidden", "true");
        items.append(item);
      }
      return items;
    }

    function createQuestion(question, mode, range) {
      const card = document.createElement("article");
      card.className = `question ${mode}`;
      card.setAttribute("aria-label", `${question.count}개 그림 문제`);
      card.append(createItems(question));
      if (mode === "write") {
        const answerArea = document.createElement("div");
        answerArea.className = "answer-area";
        const answer = document.createElement("span");
        answer.className = "answer-box";
        answer.setAttribute("aria-label", "답 쓰는 칸");
        answerArea.append(answer);
        card.append(answerArea);
      } else {
        const choices = document.createElement("div");
        choices.className = "choices";
        for (let number = range.min; number <= range.max; number += 1) {
          const choice = document.createElement("span");
          choice.className = "choice";
          choice.textContent = number;
          choices.append(choice);
        }
        card.append(choices);
      }
      return card;
    }

    function createPage(mode, range) {
      const page = document.createElement("section");
      page.className = "sheet";
      page.setAttribute("data-print-page", "");
      page.dataset.mode = mode;
      page.dataset.range = range.label;
      const exportButton = document.createElement("button");
      exportButton.type = "button";
      exportButton.className = "export-page";
      exportButton.setAttribute("data-print-hidden", "");
      exportButton.textContent = "PNG 저장";
      exportButton.addEventListener("click", () => savePageAsPng(page));
      const header = document.createElement("header");
      header.className = "header-row";
      const title = document.createElement("h1");
      title.textContent = worksheetData.title;
      const label = document.createElement("span");
      label.className = "page-label";
      label.textContent = `${mode === "write" ? "직접 쓰기" : "숫자 고르기"} · ${range.label}`;
      header.append(title, label);
      const instruction = document.createElement("p");
      instruction.className = "instruction";
      instruction.textContent = mode === "write" ? worksheetData.writeInstruction : worksheetData.chooseInstruction;
      const questions = document.createElement("div");
      questions.className = "questions";
      worksheetData.questions
        .filter((question) => question.count >= range.min && question.count <= range.max)
        .forEach((question) => questions.append(createQuestion(question, mode, range)));
      page.append(exportButton, header, instruction, questions);
      return page;
    }

    function renderWorksheets() {
      const container = document.querySelector("#worksheets");
      const pages = [];
      for (const mode of ["write", "choose"]) {
        for (const range of pageRanges) pages.push(createPage(mode, range));
      }
      container.replaceChildren(...pages);
    }

    async function savePageAsPng(page) {
      const button = page.querySelector(".export-page");
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "저장 중…";

      try {
        if (typeof html2canvas !== "function") throw new Error("html2canvas를 불러오지 못했습니다.");
        const pageIndex = [...document.querySelectorAll(".sheet")].indexOf(page);
        const canvas = await html2canvas(page, {
          scale: 2,
          backgroundColor: "#fff",
          logging: false,
          useCORS: true,
          ignoreElements: (element) => element.classList?.contains("export-page"),
          onclone: (clonedDocument) => {
            const clonedPage = clonedDocument.querySelectorAll(".sheet")[pageIndex];
            clonedPage.style.margin = "0";
            clonedPage.style.boxShadow = "none";
          }
        });

        const pngBlob = await new Promise((resolve, reject) => {
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("PNG 변환 실패")), "image/png");
        });
        const downloadUrl = URL.createObjectURL(pngBlob);
        const link = document.createElement("a");
        const modeName = page.dataset.mode === "write" ? "직접쓰기" : "숫자고르기";
        link.download = `숫자세기_${modeName}_${page.dataset.range.replace("–", "-")}.png`;
        link.href = downloadUrl;
        link.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      } catch (error) {
        console.error(error);
        alert("PNG 저장에 실패했습니다. Chrome 또는 Edge에서 다시 시도해 주세요.");
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    renderWorksheets();
  </script>
</body>
</html>
